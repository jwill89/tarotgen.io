# Weekly dependency updates, grouped so a quiet week is one pull request per
# ecosystem: minors and patches together, majors one by one (they can need code
# changes). The same shape as the Kindred Nights repo.
#
# Dependabot can't read Actions secrets. Its jobs, and CI on its pull requests,
# need these added again as Dependabot secrets (Settings > Secrets and
# variables > Dependabot): FONTAWESOME_NPM_TOKEN (the Pro icon registry) and
# ESLINT_CONFIG_TOKEN (the private eslint-config submodule: every update job
# clones the repo with its submodules, through the `github` registry below).
version: 2
registries:
  fontawesome:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
  github:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.ESLINT_CONFIG_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /frontend
    registries:
      - fontawesome
      - github
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Held on purpose: TypeScript stays on 6.x until Vue's tooling (vue-tsc)
      # supports TypeScript 7.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: composer
    directory: /backend
    registries:
      - github
    schedule:
      interval: weekly
      day: monday
    groups:
      composer-minor:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /plugin/TarotGen.Plugin
    registries:
      - github
    schedule:
      interval: weekly
      day: monday
    groups:
      dotnet:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    registries:
      - github
    schedule:
      interval: weekly
      day: monday
