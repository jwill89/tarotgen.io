name: Plugin

# The FFXIV plugin ships through its own Dalamud repo, not the site deploy, so it
# builds on its own — and only when something it is built from changes.
on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['plugin/**', '.github/workflows/plugin.yml']

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release, warnings as errors) + style
    # Linux, as Kindred Nights' plugin job does: the .csproj enables Windows
    # targeting off Windows, and DALAMUD_HOME says where Dalamud is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The Dalamud dev distribution the SDK compiles against (XIVLauncher installs
      # it locally). A Dalamud API bump the .csproj's SDK doesn't match fails here,
      # which is the point.
      - name: Dalamud
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dalamud.zip" https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$RUNNER_TEMP/dalamud"
          echo "DALAMUD_HOME=$RUNNER_TEMP/dalamud" >> "$GITHUB_ENV"

      # The .csproj turns analyzer and code-style warnings into errors (AUDIT §6.3).
      - name: Build
        run: dotnet build plugin/TarotGen.Plugin/TarotGen.Plugin.csproj --configuration Release

      # Formatting the build's style check doesn't cover (whitespace, layout).
      - name: Style
        run: dotnet format plugin/TarotGen.Plugin/TarotGen.Plugin.csproj --verify-no-changes

      # The packaged plugin (latest.zip + manifest), as deploy.ps1 -Target plugin
      # would publish it.
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: TarotGen.Plugin
          path: plugin/TarotGen.Plugin/bin/Release/TarotGen.Plugin/
          if-no-files-found: error
          retention-days: 7
