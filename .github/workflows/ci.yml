name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when newer commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vue / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # frontend/eslint-config (shared @jwill89/eslint-config)
          # The default GITHUB_TOKEN can't read the private eslint-config repo, so
          # supply a PAT with read access to both repos (checkout reuses it for
          # submodule fetches on github.com). Falls back to GITHUB_TOKEN locally.
          token: ${{ secrets.ESLINT_CONFIG_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The icons come from the private Font Awesome Pro kit, which requires an
      # auth token to install. Provide it as the FONTAWESOME_NPM_TOKEN repo
      # secret; the gitignored frontend/.npmrc is recreated here for CI.
      - name: Configure Font Awesome Pro registry
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
        run: |
          if [ -z "$FONTAWESOME_NPM_TOKEN" ]; then
            echo "::error::FONTAWESOME_NPM_TOKEN secret is not set — npm ci cannot install the Font Awesome Pro kit."
            exit 1
          fi
          {
            echo "@awesome.me:registry=https://npm.fontawesome.com/"
            echo "@fortawesome:registry=https://npm.fontawesome.com/"
            echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_TOKEN}"
          } > .npmrc

      - name: Install dependencies
        run: npm ci

      # The generated API types must match the committed OpenAPI spec.
      - name: Verify generated API types are current
        run: |
          npm run gen:types
          git diff --exit-code src/types/api.generated.ts

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  backend:
    name: Backend (PHP / Slim)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, curl, openssl, gmp
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # The committed OpenAPI spec must match the swagger-php attributes.
      # (composer test also enforces this via OpenApiSpecTest.)
      - name: Verify OpenAPI spec is current
        run: |
          composer docs
          git diff --exit-code openapi.json

      - name: Coding standard (PHPCS / PSR-12)
        run: composer lint

      - name: Unit tests (PHPUnit)
        run: composer test

      - name: Static analysis (PHPStan)
        run: composer stan

  # On a push to main, AFTER the gate passes, tag + release the project version
  # if it has no release yet. Tag = v<version> (frontend/package.json); release
  # body = the CHANGELOG "## [<version>]" section — so a green version bump
  # auto-publishes a release linked to its notes. Idempotent: a version already
  # released is skipped, so ordinary pushes are a no-op.
  release:
    name: Tag + release (main, on version bump)
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to detect what's already released

      - name: Tag + release on version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh
