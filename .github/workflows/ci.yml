name: CI

on:
  push:
    branches: [master, vue]
  pull_request:

# Cancel an in-progress run when newer commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vue / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The icons come from the private Font Awesome Pro kit, which requires an
      # auth token to install. Provide it as the FONTAWESOME_NPM_TOKEN repo
      # secret; the gitignored frontend/.npmrc is recreated here for CI.
      - name: Configure Font Awesome Pro registry
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
        run: |
          if [ -z "$FONTAWESOME_NPM_TOKEN" ]; then
            echo "::error::FONTAWESOME_NPM_TOKEN secret is not set — npm ci cannot install the Font Awesome Pro kit."
            exit 1
          fi
          {
            echo "@awesome.me:registry=https://npm.fontawesome.com/"
            echo "@fortawesome:registry=https://npm.fontawesome.com/"
            echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_TOKEN}"
          } > .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  backend:
    name: Backend (PHP / Slim)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, curl, openssl, gmp
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standard (PHPCS / PSR-12)
        run: composer lint

      - name: Unit tests (PHPUnit)
        run: composer test

      - name: Static analysis (PHPStan)
        run: composer stan
