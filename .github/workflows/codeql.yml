name: CodeQL

# GitHub's security analysis (free on a public repo). CodeQL has no PHP support,
# so it covers the frontend, the plugin and these workflows; PHPStan, the
# security advisories check and the tests cover the backend.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries run over code that hasn't changed.
    - cron: '23 4 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # No build needed: the plugin compiles only against Dalamud, which
        # build-mode none does without.
        language: [javascript-typescript, csharp, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
